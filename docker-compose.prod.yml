x-laravel: &laravel
  image: ghcr.io/mahdirahmani1376/zitazi-php:latest
  networks:
    - app-network
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  volumes:
    - ./google_key.json:/var/www/html/storage/app/private/google_key.json:ro
    - ./private.key:/var/www/html/storage/app/private/private.key:ro
    - laravel-storage:/var/www/html/storage
  env_file:
    - /opt/zitazi/.env
  environment:
    TZ: Asia/Tehran
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  php:
    <<: *laravel
    container_name: zitazi-php
    command: php-fpm

  horizon:
    <<: *laravel
    container_name: zitazi-horizon
    command: php artisan horizon

  reverb:
    <<: *laravel
    command: php artisan reverb:start
    container_name: zitazi-reverb
    ports:
      - "8080:8080"

  scrape-result:
    <<: *laravel
    command: php artisan listen:scrape
    container_name: zitazi-scrape-result

  sync-status:
    <<: *laravel
    command: php artisan listen:sync-status
    container_name: zitazi-sync-status

  node:
    image: ghcr.io/mahdirahmani1376/zitazi-node:latest
    container_name: zitazi-node
    restart: unless-stopped
    networks:
      - app-network
    environment:
      TZ: Asia/Tehran
      NODE_ENV: production
    shm_size: "1gb"
    mem_limit: 1500m
    command: node daemon.js
    depends_on:
      - php
      - redis

  nginx:
    image: ghcr.io/mahdirahmani1376/zitazi-nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/.acme.sh/zitazi-crawler.ir_ecc:/etc/nginx/certs:ro
      - /opt/zitazi/infra/nginx/production/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network
    environment:
      TZ: Asia/Tehran

    container_name: zitazi-nginx
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Tehran
    ports:
      - "3308:3306"
    networks:
      - app-network
    container_name: zitazi-mysql
    restart: unless-stopped
    volumes:
      - /opt/zitazi/infra/mysql-conf/my.cnf:/etc/mysql/my.cnf
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    environment:
      TZ: Asia/Tehran
    networks:
      - app-network
    container_name: zitazi-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 200mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: zitazi-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 512M
      TZ: Asia/Tehran
    networks:
      - app-network

  loki:
    image: grafana/loki
    container_name: zitazi-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - /opt/zitazi/infra/loki-config.yml:/etc/loki/config.yml
      - loki-data:/loki
    networks:
      - app-network

  promtail:
    image: grafana/promtail:latest
    container_name: zitazi-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/zitazi/infra/promtail-config.yml:/etc/promtail/config.yml
      - promtail-data:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    container_name: zitazi-grafana
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.zitazi-crawler.ir
      - GF_SERVER_DOMAIN=grafana.zitazi-crawler.ir
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-890rty@(%}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-890rty@(%}
    depends_on:
      - loki
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: zitazi-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - prometheus-data:/prometheus
      - /opt/zitazi/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/zitazi/infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - node-exporter
      - alertmanager
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: zitazi-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - app-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: zitazi-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager-data:/alertmanager
      - /opt/zitazi/infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - app-network

volumes:
  laravel-storage:
    name: zitazi-laravel-storage
  promtail-data:
    name: zitazi-promtail-data
  loki-data:
    name: zitazi-loki-data
  grafana-data:
    name: zitazi-grafana-data
  mysql-data:
    name: zitazi-mysql-data
  redis-data:
    name: zitazi-redis-data
  prometheus-data:
    name: zitazi-prometheus-data
  alertmanager-data:
    name: zitazi-alertmanager-data

networks:
  app-network:
    driver: bridge
