x-laravel: &laravel
  env_file:
    - path: ./.env
      required: true
  build:
    context: .
    dockerfile: ./docker/Dockerfile.dev
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
      USER: ${DOCKER_USER:-mahdi}
  networks:
    - app-network
  volumes:
    - ./src:/var/www/html
    - ./.env:/var/www/html/.env
    - ./infra/php.ini:/usr/local/etc/php/php.ini
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    - mysql
    - redis

services:
  php:
    <<: *laravel
    command: php-fpm
    container_name: zitazi-php

  horizon:
    <<: *laravel
    container_name: zitazi-horizon
    command: php artisan horizon

  reverb:
    <<: *laravel
    command: php artisan reverb:start
    container_name: zitazi-reverb
    ports:
      - "8080:8080"

  scrape-result:
    <<: *laravel
    command: php artisan listen:scrape
    container_name: zitazi-scrape-result

  sync-status:
    <<: *laravel
    command: php artisan listen:sync-status
    container_name: zitazi-sync-status

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./infra/nginx/local/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network
    container_name: zitazi-nginx
    restart: unless-stopped

  mysql:
    env_file:
      - path: ./.env
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql-conf/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network
    container_name: zitazi-mysql
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    container_name: zitazi-redis
    restart: unless-stopped
    command: redis-server
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    container_name: zitazi-scraper
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper.dev
    volumes:
      - ./scraper:/app
    restart: unless-stopped
    networks:
      - app-network
    environment:
      TZ: Asia/Tehran
      NODE_ENV: development
    shm_size: "1gb"
    mem_limit: 1500m
    command: sleep infinity
    depends_on:
      - redis

volumes:
  mysql-data:
    name: zitazi-mysql-data
  redis-data:
    name: zitazi-redis-data

networks:
  app-network:
    driver: bridge
