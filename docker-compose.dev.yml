x-laravel: &laravel
  build:
    context: .
    dockerfile: ./docker/Dockerfile.dev
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
      USER: ${DOCKER_USER:-mahdi}
  networks:
    - app-network
  volumes:
    - ./src:/var/www/html
    # Single source of truth: the root .env is mounted as the Laravel env file.
    # It is NOT injected as container env vars (env_file), so Laravel's own
    # .env loader (and --env=testing's .env.testing) actually take effect.
    - ./.env:/var/www/html/.env:ro
    - ./src/.env.testing:/var/www/html/.env.testing
    - ./infra/dev.php.ini:/usr/local/etc/php/php.ini
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  php:
    <<: *laravel
    command: php-fpm
    container_name: zitazi-php
    healthcheck:
      test: [ "CMD-SHELL", "php-fpm -t && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  horizon:
    <<: *laravel
    container_name: zitazi-horizon
    command: php artisan horizon

  reverb:
    <<: *laravel
    command: php artisan reverb:start
    container_name: zitazi-reverb
    ports:
      - "8080:8080"

  scrape-result:
    <<: *laravel
    command: php artisan listen:scrape
    container_name: zitazi-scrape-result

  torob-listener:
    <<: *laravel
    command: php artisan listen:torob
    container_name: zitazi-torob-listener

  sync-status:
    <<: *laravel
    command: php artisan listen:sync-status
    container_name: zitazi-sync-status

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./infra/nginx/local/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    container_name: zitazi-nginx
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Tehran}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql-conf/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network
    container_name: zitazi-mysql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    container_name: zitazi-redis
    restart: unless-stopped
    command: redis-server
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    container_name: zitazi-scraper
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper.dev
    volumes:
      - ./scraper:/app
    restart: unless-stopped
    networks:
      - app-network
    environment:
      TZ: Asia/Tehran
      NODE_ENV: development
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PROXY_IP : ${PROXY_IP}
      PROXY_USER : ${PROXY_USER}
      PROXY_PASSWORD : ${PROXY_PASSWORD}
      CHROME_USER_DATA_DIR: /app/chrome-profile
      # Headful Chromium under Xvfb passes Cloudflare's challenge that blocks
      # headless Chromium from Decathlon.
      SCRAPER_HEADFUL: "1"
      DISPLAY: ":99"

    ports:
      - "9229:9229"
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6080:6080"
    shm_size: "1gb"
    mem_limit: 1500m
    command: ["/usr/local/bin/scraper-entrypoint.sh"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql-data:
    name: zitazi-mysql-data
  redis-data:
    name: zitazi-redis-data

networks:
  app-network:
    driver: bridge
