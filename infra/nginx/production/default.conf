server {
    listen 80;
    listen [::]:80;

    server_name zitazi-crawler.ir www.zitazi-crawler.ir ws.zitazi-crawler.ir phpmyadmin.zitazi-crawler.ir grafana.zitazi-crawler.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
        try_files $uri =404;
    }

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}