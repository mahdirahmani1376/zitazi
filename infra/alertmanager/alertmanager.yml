global:
  resolve_timeout: 5m

route:
  receiver: telegram

  group_by:
    - alertname

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_bot_token
        chat_id: 3953278794
        send_resolved: true
        parse_mode: HTML