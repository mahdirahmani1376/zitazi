name: Build & Deploy To Vps

on:
  push:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push PHP image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile.production
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zitazi-php:latest
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Nginx image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile.nginx
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zitazi-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Mysql image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile.mysql
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zitazi-mysql:latest
          cache-from: type=gha,scope=mysql
          cache-to: type=gha,mode=max,scope=mysql
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Grafana image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile.grafana
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zitazi-grafana:latest
          cache-from: type=gha,scope=grafana
          cache-to: type=gha,mode=max,scope=grafana
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Promtail image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile.promtail
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zitazi-promtail:latest
          cache-from: type=gha,scope=promtail
          cache-to: type=gha,mode=max,scope=promtail
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Node image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile.node.production
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zitazi-node:latest
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: "./docker-compose.prod.yml"
          target: "/opt/zitazi/docker-compose.yml"

      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd /opt/zitazi
            
            echo "Pulling latest images..."
            docker compose pull
            
            echo "Recreating containers..."
            docker compose up -d --remove-orphans --no-build
            
            echo "Running migrations..."
            docker compose exec php php artisan migrate --force

            echo "Cleaning old images..."
            docker image prune -f
            

