name: Build & Deploy To VPS

on:
  push:
    branches: ["master"]

concurrency:
  group: production-deploy
  cancel-in-progress: true
  
env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-php-nginx:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PHP
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/zitazi-php:latest
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

      - name: Build and push Nginx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/zitazi-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  build-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scraper
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.scraper.production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/zitazi-scraper:latest
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,mode=max,scope=scraper

  deploy:
    needs:
      - build-php-nginx
      - build-scraper

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,infra/"
          target: "/opt/zitazi/"
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd /opt/zitazi

            mv -f docker-compose.prod.yml docker-compose.yml

            docker compose exec -T horizon php artisan horizon:terminate
            
            echo "Pulling application images..."
            docker compose pull php scraper nginx

            echo "Starting application..."
            docker compose up -d --remove-orphans --no-build --wait

            echo "Running migrations..."
            docker compose exec -T php php artisan migrate --force

            echo "Cleaning unused images..."
            docker image prune -f